[project]
name = "pjm-eval"
version = "0.1.0"
description = "Eval harness for PJM BESS backtests"
authors = [{ name = "Lauri Sarap" }]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "matplotlib>=3.7",
    "jinja2>=3.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pjm_eval*"]
