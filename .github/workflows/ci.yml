name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest engine optimization evaluation viz_server -q
      - name: End-to-end quickstart on synthetic data
        run: |
          uv run python evaluation/scripts/generate_synthetic_data.py
          uv run python optimization/scripts/run_perfect_foresight.py

  viz-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: viz_client
      - run: bun run build
        working-directory: viz_client
